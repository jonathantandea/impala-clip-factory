<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Render</title>
<style>
  @font-face { font-family: Display; src: url(fonts/display.woff2) format('woff2'); font-weight: 800; }
  :root { --bg: #151413; --ink: #edebe6; --muted: #a29e96; --accent: #ff7043; --line: #33312d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { margin-right: auto; }
  button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: #1f1e1c; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; }
  .stage { display: grid; place-items: center; min-height: 0; padding: 12px; }
  canvas { max-height: calc(100vh - 90px); max-width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 10px; }
  #status { color: var(--muted); font-size: 13px; min-width: 200px; }
  input[type=range] { width: 220px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/story/vendor/three/build/three.module.js",
  "three/addons/": "/story/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <b id="title">Memuat…</b>
  <button id="play" disabled>▶ Putar</button>
  <input type="range" id="scrub" min="0" max="100" step="0.01" value="0" aria-label="Posisi">
  <button id="render" class="primary" disabled>Render video</button>
  <span id="status"></span>
</header>
<div class="stage"><canvas id="out"></canvas></div>
<script type="module">
import { createStory } from './engine.js';
const q = new URLSearchParams(location.search);
const project = q.get('project');
const base = `/motion/projects/${encodeURIComponent(project)}/`;
const $ = (id) => document.getElementById(id);
const status = (s) => { $('status').textContent = s; };
let story;
try {
  story = await createStory($('out'), base);
} catch (e) {
  status('Gagal memuat: ' + e.message); throw e;
}
$('title').textContent = story.spec.title || project;
$('scrub').max = story.duration;
story.seek(0.5);
['play', 'render'].forEach((id) => { $(id).disabled = false; });
status(`${story.duration.toFixed(1)} detik · ${story.scenes} adegan`);

// preview with narration
const audio = new Audio(base + 'vo.wav');
let playing = false;
function loop() { if (!playing) return; story.seek(audio.currentTime); $('scrub').value = audio.currentTime; requestAnimationFrame(loop); }
$('play').onclick = () => {
  playing = !playing; $('play').textContent = playing ? '❚❚ Jeda' : '▶ Putar';
  if (playing) { audio.play(); loop(); } else audio.pause();
};
audio.onended = () => { playing = false; $('play').textContent = '▶ Putar'; };
$('scrub').oninput = () => { audio.currentTime = Number($('scrub').value); story.seek(audio.currentTime); };

// render: each frame is painted, encoded as JPEG and streamed to the local server, which pipes it into ffmpeg
const FPS = 30;
async function post(path, body, headers = {}) {
  const r = await fetch(path, { method: 'POST', body, headers });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
$('render').onclick = async () => {
  playing = false; audio.pause();
  $('render').disabled = true; $('play').disabled = true;
  const n = Math.round(story.duration * FPS);
  const t0 = performance.now();
  try {
    await post('/api/story/render/start', JSON.stringify({ project, fps: FPS, frames: n }), { 'Content-Type': 'application/json' });
    for (let i = 0; i < n; i++) {
      story.seek((i + 0.5) / FPS);
      const blob = await new Promise((res) => $('out').toBlob(res, 'image/jpeg', 0.9));
      await post(`/api/story/render/frame?project=${encodeURIComponent(project)}&i=${i}`, blob);
      if (i % 10 === 0) {
        const fps = (i + 1) / ((performance.now() - t0) / 1000);
        status(`Render ${i + 1}/${n} frame · ${fps.toFixed(1)} fps · sisa ${((n - i) / fps / 60).toFixed(1)} menit`);
        $('scrub').value = i / FPS;
      }
    }
    status('Menggabungkan video, narasi dan musik…');
    const r = await post('/api/story/render/finish', JSON.stringify({ project }), { 'Content-Type': 'application/json' });
    status(`Selesai dalam ${((performance.now() - t0) / 60000).toFixed(1)} menit → galeri Motion Factory (${r.file})`);
    window.RENDER_DONE = r;
  } catch (e) {
    status('Render gagal: ' + e.message);
    window.RENDER_DONE = { error: e.message };
    fetch('/api/story/render/cancel', { method: 'POST', body: JSON.stringify({ project }), headers: { 'Content-Type': 'application/json' } });
  }
  $('render').disabled = false; $('play').disabled = false;
};
if (q.get('autorender') === '1') $('render').click();
</script>
</body>
</html>
